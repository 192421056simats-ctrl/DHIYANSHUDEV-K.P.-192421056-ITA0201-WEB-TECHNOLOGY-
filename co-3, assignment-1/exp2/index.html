<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servlet Student Result Processing | Exp 2</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-page: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(at 100% 0%, rgba(79, 70, 229, 0.08) 0px, transparent 50%),
                              radial-gradient(at 0% 100%, rgba(147, 51, 234, 0.08) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-size: 0.95rem;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .marks-section {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-top: 0.5rem;
        }

        .marks-section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-submit {
            margin-top: 1rem;
            background: var(--primary);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">CO3 - Experiment 2</span>
            <h1>Student Result Entry</h1>
            <p>Servlet-Based Server-Side Processing & Mark Assessment</p>
        </div>

        <!-- HTML Form submitting data using HTTP POST method to Java Servlet -->
        <form action="ResultServlet" method="POST">
            <div class="form-group">
                <label for="studentName">Student Name *</label>
                <input type="text" id="studentName" name="studentName" placeholder="e.g. Sarah Jenkins" required>
            </div>

            <div class="form-group">
                <label for="regNumber">Register Number *</label>
                <input type="text" id="regNumber" name="regNumber" placeholder="e.g. 21IT102" required>
            </div>

            <div class="marks-section">
                <div class="marks-section-title">
                    <span>📊</span> Subject Marks (Range: 0 - 100)
                </div>
                
                <div class="form-group" style="margin-bottom: 0.8rem;">
                    <label for="mark1">Subject 1 Mark (Web Technologies) *</label>
                    <input type="number" id="mark1" name="mark1" min="0" max="100" placeholder="0 - 100" required>
                </div>

                <div class="form-group" style="margin-bottom: 0.8rem;">
                    <label for="mark2">Subject 2 Mark (Data Structures) *</label>
                    <input type="number" id="mark2" name="mark2" min="0" max="100" placeholder="0 - 100" required>
                </div>

                <div class="form-group">
                    <label for="mark3">Subject 3 Mark (Database Systems) *</label>
                    <input type="number" id="mark3" name="mark3" min="0" max="100" placeholder="0 - 100" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                🚀 Calculate & Generate Result
            </button>
        </form>
    </div>
</body>
</html>
