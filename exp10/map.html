<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Campus Interactive Map</title>
  <link rel="stylesheet" href="../global.css">
  <style>
    body {
      background: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .map-svg {
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 300px;
    }
  </style>
</head>
<body>
  <!-- Campus Map Vector Representation -->
  <svg class="map-svg" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Grid lines -->
    <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 100 0 L 100 200 M 200 0 L 200 200 M 300 0 L 300 200" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    
    <!-- Roads -->
    <rect x="180" y="0" width="40" height="200" fill="rgba(255,255,255,0.05)" />
    <rect x="0" y="80" width="400" height="40" fill="rgba(255,255,255,0.05)" />
    
    <!-- Blocks -->
    <!-- Admin Block -->
    <rect x="30" y="15" width="100" height="50" rx="4" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="80" y="45" fill="#fff" font-family="Outfit, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ADMIN BLOCK A</text>
    
    <!-- Academic Block -->
    <rect x="250" y="15" width="120" height="50" rx="4" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="310" y="45" fill="#fff" font-family="Outfit, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ACADEMIC BLOCK B</text>

    <!-- Lab Block -->
    <rect x="30" y="135" width="100" height="50" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="80" y="165" fill="#fff" font-family="Outfit, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CSE LABS BLOCK C</text>

    <!-- Hostel Block -->
    <rect x="250" y="135" width="120" height="50" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
    <text x="310" y="165" fill="#fff" font-family="Outfit, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HOSTEL BLOCK D</text>
    
    <!-- Legend -->
    <circle cx="200" cy="100" r="8" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="200" cy="100" r="3" fill="#ef4444" />
    <text x="215" y="104" fill="#ef4444" font-family="Outfit, sans-serif" font-size="8" font-weight="700">YOU ARE HERE</text>
  </svg>
</body>
</html>
