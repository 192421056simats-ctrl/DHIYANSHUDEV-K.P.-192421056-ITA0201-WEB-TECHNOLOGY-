<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 6 - Dynamic To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>

    <main class="todo-app container">
        <div class="glass-card">
            <!-- Header Bar -->
            <header class="app-header">
                <div>
                    <span class="header-badge">Experiment 6</span>
                    <h1>Dynamic Task Manager</h1>
                    <p class="subtitle">Organize tasks with categories, priorities, due dates & LocalStorage persistence.</p>
                </div>
                <button id="themeToggleBtn" class="theme-btn" aria-label="Toggle Theme">🌙</button>
            </header>

            <!-- Search & Action Bar -->
            <section class="controls-bar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search tasks by title...">
                </div>

                <div class="filter-group">
                    <select id="statusFilter">
                        <option value="all">All Tasks</option>
                        <option value="active">Active Tasks</option>
                        <option value="completed">Completed Tasks</option>
                    </select>

                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="Academic">Academic</option>
                        <option value="Project">Project</option>
                        <option value="Exam">Exam</option>
                        <option value="Personal">Personal</option>
                    </select>

                    <select id="priorityFilter">
                        <option value="all">All Priorities</option>
                        <option value="High">High Priority</option>
                        <option value="Medium">Medium Priority</option>
                        <option value="Low">Low Priority</option>
                    </select>

                    <button id="addTaskModalBtn" class="btn primary-btn">+ New Task</button>
                </div>
            </section>

            <!-- Task Statistics Bar -->
            <div class="task-stats">
                <div class="stat-pill"><span id="totalTasksCount">0</span> Total</div>
                <div class="stat-pill active-pill"><span id="activeTasksCount">0</span> Active</div>
                <div class="stat-pill done-pill"><span id="completedTasksCount">0</span> Completed</div>
            </div>

            <!-- Task List Container -->
            <ul id="taskList" class="task-list">
                <!-- Dynamically populated -->
            </ul>
        </div>
    </main>

    <!-- Add / Edit Task Modal -->
    <div id="taskModal" class="modal-overlay">
        <div class="modal-card glass-card">
            <div class="modal-header">
                <h2 id="modalTitle">Create New Task</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            
            <form id="taskForm">
                <input type="hidden" id="taskId">

                <div class="form-group">
                    <label for="taskTitle">Task Title <span class="required">*</span></label>
                    <input type="text" id="taskTitle" placeholder="e.g. Complete Web Tech Exp 6" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory">
                            <option value="Academic">Academic</option>
                            <option value="Project">Project</option>
                            <option value="Exam">Exam</option>
                            <option value="Personal">Personal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate" required>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancelTaskBtn" class="btn secondary-btn">Cancel</button>
                    <button type="submit" class="btn primary-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
