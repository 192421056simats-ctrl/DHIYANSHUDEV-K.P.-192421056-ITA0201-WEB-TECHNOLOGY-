<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 2 - Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>

    <main class="container">
        <div class="glass-card">
            <header class="form-header">
                <div>
                    <span class="header-tag">Academic Portal</span>
                    <h1>Student Registration Form</h1>
                    <p class="subtitle">Complete the fields below with real-time validation checks.</p>
                </div>
                <button id="themeToggleBtn" class="theme-btn" aria-label="Toggle Theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </header>

            <form id="registrationForm" novalidate>
                <!-- Section 1: Personal & Identification Information -->
                <div class="form-section">
                    <h2 class="section-title">1. Personal & Identification</h2>
                    
                    <div class="form-grid">
                        <!-- Full Name -->
                        <div class="form-group">
                            <label for="fullName">Full Name <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="text" id="fullName" placeholder="e.g. Johnathan Doe" required>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="fullNameError"></span>
                        </div>

                        <!-- Roll Number -->
                        <div class="form-group">
                            <label for="rollNumber">Roll Number <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="text" id="rollNumber" placeholder="e.g. 21CS045" required>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="rollNumberError"></span>
                        </div>

                        <!-- Register Number -->
                        <div class="form-group">
                            <label for="registerNumber">Register Number <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="text" id="registerNumber" placeholder="12 digit reg. no (e.g. 917821040045)" required>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="registerNumberError"></span>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email Address <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="email" id="email" placeholder="student@institution.edu" required>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="emailError"></span>
                        </div>

                        <!-- Phone -->
                        <div class="form-group">
                            <label for="phone">Phone Number <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="tel" id="phone" placeholder="10 Digit Phone Number" maxlength="10" required>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="phoneError"></span>
                        </div>

                        <!-- Date of Birth -->
                        <div class="form-group">
                            <label for="dob">Date of Birth <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="date" id="dob" required>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="dobError"></span>
                        </div>

                        <!-- Gender -->
                        <div class="form-group">
                            <label for="gender">Gender <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <select id="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other / Prefer not to say</option>
                                </select>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="genderError"></span>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Academic Details -->
                <div class="form-section">
                    <h2 class="section-title">2. Academic Information</h2>
                    
                    <div class="form-grid">
                        <!-- Department -->
                        <div class="form-group">
                            <label for="department">Department <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <select id="department" required>
                                    <option value="">Select Department</option>
                                    <option value="Computer Science">Computer Science & Engineering</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Cyber Security">Cyber Security</option>
                                    <option value="Electronics & Communication">Electronics & Communication</option>
                                    <option value="Electrical Engineering">Electrical Engineering</option>
                                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                                </select>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="departmentError"></span>
                        </div>

                        <!-- Semester -->
                        <div class="form-group">
                            <label for="semester">Semester <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <select id="semester" required>
                                    <option value="">Select Semester</option>
                                    <option value="Sem 1">Semester 1</option>
                                    <option value="Sem 2">Semester 2</option>
                                    <option value="Sem 3">Semester 3</option>
                                    <option value="Sem 4">Semester 4</option>
                                    <option value="Sem 5">Semester 5</option>
                                    <option value="Sem 6">Semester 6</option>
                                    <option value="Sem 7">Semester 7</option>
                                    <option value="Sem 8">Semester 8</option>
                                </select>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="semesterError"></span>
                        </div>

                        <!-- Address -->
                        <div class="form-group full-width">
                            <label for="address">Permanent Address <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <textarea id="address" rows="3" placeholder="Enter complete residential address..." required></textarea>
                                <span class="status-icon"></span>
                            </div>
                            <span class="error-msg" id="addressError"></span>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Credentials & Security -->
                <div class="form-section">
                    <h2 class="section-title">3. Password & Terms</h2>
                    
                    <div class="form-grid">
                        <!-- Password -->
                        <div class="form-group">
                            <label for="password">Password <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="password" id="password" placeholder="Create strong password" required>
                                <button type="button" class="toggle-pass-btn" data-target="password" aria-label="Toggle password visibility">👁️</button>
                            </div>
                            <!-- Password Strength Indicator Meter -->
                            <div class="strength-meter">
                                <div class="meter-bar" id="strengthBar"></div>
                            </div>
                            <span class="strength-text" id="strengthText">Password Strength</span>
                            <span class="error-msg" id="passwordError"></span>
                        </div>

                        <!-- Confirm Password -->
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                                <button type="button" class="toggle-pass-btn" data-target="confirmPassword" aria-label="Toggle password visibility">👁️</button>
                            </div>
                            <span class="error-msg" id="confirmPasswordError"></span>
                        </div>

                        <!-- Terms Checkbox -->
                        <div class="form-group full-width checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="terms" required>
                                <span class="custom-checkbox"></span>
                                <span>I agree to the <a href="#">Terms & Conditions</a> and confirm all entered data is accurate. <span class="required">*</span></span>
                            </label>
                            <span class="error-msg" id="termsError"></span>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-actions">
                    <button type="button" class="btn secondary-btn" id="fillSampleBtn">Fill Dhiyanshu's Profile</button>
                    <button type="reset" class="btn secondary-btn">Reset Form</button>
                    <button type="submit" class="btn primary-btn" id="submitBtn">Register Student</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <div class="success-icon">✓</div>
                <h2>Registration Successful!</h2>
            </div>
            <div class="modal-body" id="modalSummary">
                <!-- Populated dynamically via JS -->
            </div>
            <div class="modal-footer">
                <button class="btn primary-btn" id="closeModalBtn">Done</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
